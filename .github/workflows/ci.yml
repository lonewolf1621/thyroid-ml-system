name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=thyroid --cov=api --cov-report=term-missing

  train:
    name: Train & evaluate on the public dataset
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt mlflow
      - run: python -m thyroid.data download --out data/hypothyroid.csv
      - run: python -m thyroid.train --data data/hypothyroid.csv --out models --mlflow
      - name: Publish model card to the job summary
        run: tee -a "$GITHUB_STEP_SUMMARY" < models/MODEL_CARD.md
      - uses: actions/upload-artifact@v4
        with:
          name: model-package
          path: |
            models/metadata.json
            models/MODEL_CARD.md
            models/drift_reference.json

  container:
    name: Build image & smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t thyroid-ml-system:ci .
      - name: Run
        run: docker run -d --name api -p 8000:8000 -e PREDICTION_LOG_PATH=/app/logs/predictions.jsonl thyroid-ml-system:ci
      - name: Wait until ready
        run: |
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/ready && exit 0
            sleep 2
          done
          docker logs api; exit 1
      - name: Smoke test predictions
        run: |
          set -e
          hypo=$(curl -fsS -X POST localhost:8000/v1/predict -H 'Content-Type: application/json' \
            -d '{"age":61,"sex":"F","TSH":45,"T3":1.0,"TT4":48,"T4U":0.9,"FTI":53,"query_hypothyroid":true}')
          healthy=$(curl -fsS -X POST localhost:8000/v1/predict -H 'Content-Type: application/json' \
            -d '{"age":34,"sex":"M","TSH":1.4,"T3":2.1,"TT4":112,"T4U":1.0,"FTI":112}')
          echo "hypothyroid example: $hypo"; echo "healthy example: $healthy"
          test "$(echo "$hypo" | jq -r .prediction)" = "hypothyroid"
          test "$(echo "$healthy" | jq -r .prediction)" = "negative"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/predict -H 'Content-Type: application/json' -d '{"age":-1}')" = "422"
          curl -fsS localhost:8000/ | grep -q "Thyroid ML System"
          curl -fsS localhost:8000/v1/monitoring/drift | jq .status
      - name: Latency benchmark (200 sequential requests)
        run: |
          body='{"age":61,"sex":"F","TSH":45,"T3":1.0,"TT4":48,"T4U":0.9,"FTI":53,"query_hypothyroid":true}'
          for i in $(seq 1 20); do curl -s -o /dev/null -X POST localhost:8000/v1/predict -H 'Content-Type: application/json' -d "$body"; done
          for i in $(seq 1 200); do
            curl -s -o /dev/null -D - -X POST localhost:8000/v1/predict -H 'Content-Type: application/json' -d "$body" \
              | grep -i '^x-latency-ms' | awk '{print $2}' | tr -d '\r'
          done | sort -n > lat.txt
          p50=$(sed -n '100p' lat.txt); p95=$(sed -n '190p' lat.txt); p99=$(sed -n '198p' lat.txt)
          echo "server-side latency over 200 requests: p50=${p50} ms p95=${p95} ms p99=${p99} ms"
          echo "### Latency (server-side, 200 requests): p50 ${p50} ms · p95 ${p95} ms · p99 ${p99} ms" >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs api | tail -50
      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/${{ github.repository }}
          docker tag thyroid-ml-system:ci "$image:latest"
          docker tag thyroid-ml-system:ci "$image:${GITHUB_SHA::7}"
          docker push "$image:latest"
          docker push "$image:${GITHUB_SHA::7}"
