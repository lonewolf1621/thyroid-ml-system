name: uptime

# Live checks of the deployed API, run by GitHub (no local machine needed).
# Every 6 hours: health, all three tabular models, batch CSV scoring and an
# image prediction with Grad-CAM. A failure opens (or comments on) an issue
# labelled "uptime"; the next passing run closes it.
on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Smoke-test the live API
        run: python scripts/smoke_test.py https://thyroid-ml-system.onrender.com

  report:
    needs: [api]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      API_RESULT: ${{ needs.api.result }}
    steps:
      - name: Open or close the uptime issue
        run: |
          gh label create uptime --color B60205 --description "Live demo check failed" 2>/dev/null || true
          open=$(gh issue list --label uptime --state open --json number --jq '.[0].number')
          if [ "$API_RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Back up: all live checks passed ($RUN_URL)."
            fi
            echo "All live checks passed"
            exit 0
          fi
          body="Live check failed at $(date -u +'%Y-%m-%d %H:%M UTC') (API: $API_RESULT).

          Logs: $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Live demo down" --label uptime --body "$body"
          fi
          exit 1
