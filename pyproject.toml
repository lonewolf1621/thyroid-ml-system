[project]
name = "thyroid-ml-system"
version = "2.0.0"
description = "Hypothyroidism risk prediction: reproducible training, FastAPI serving, drift monitoring."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # FastAPI File(...) defaults; long lines in report templates
